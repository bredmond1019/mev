[workspace]
resolver = "2"
members = [".", "crates/mev-learn-ai"]
# Without this, `cargo test`/`cargo build` invoked at the workspace root (no `-p`) default to
# just the root `mev` package (a mixed workspace/package manifest's default is itself, not every
# member) — so mev-learn-ai's own moved test suites would silently never run under the plain
# `cargo test` / `cargo test --features learn-ai` commands this repo's harness actually runs.
default-members = [".", "crates/mev-learn-ai"]

[package]
name = "mev"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.dev]
# Keep panic/backtrace line numbers; drop full DWARF type descriptions (biggest link-time cost).
debug = "line-tables-only"
# Skip macOS's dsymutil debug-info-bundling pass (a slow post-link step run once per binary);
# leave debug info split across .o files instead. Backtraces still resolve correctly.
split-debuginfo = "unpacked"

[dependencies]
anyhow = "1.0.102"
colored = "2"
chrono = "0.4"
clap = { version = "4.6.1", features = ["derive"] }
mev-learn-ai = { path = "crates/mev-learn-ai", optional = true }
okf-core = { path = "../okf-core" }
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0.18"
toml = "0.8"
walkdir = "2.5.0"

[features]
default = []
# Business-specific learn-ai/funnel content tooling. Off by default so a public mev build
# carries no reference to the extracted crate. See crates/mev-learn-ai.
learn-ai = ["dep:mev-learn-ai"]
